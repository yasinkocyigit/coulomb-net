<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Coulomb-Net research pipeline</title>
  <desc id="desc">High-level research workflow from physical simulation to model evaluation.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#222"/>
    </marker>
    <style>
      .box { fill: #fff; stroke: #222; stroke-width: 2; }
      .head { fill: #222; }
      .htext { fill: #fff; font: 600 18px Arial, sans-serif; text-anchor: middle; }
      .text { fill: #222; font: 15px Arial, sans-serif; text-anchor: middle; }
      .note { fill: #444; font: 14px Arial, sans-serif; text-anchor: middle; }
      .arrow { fill: none; stroke: #222; stroke-width: 2; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="360" fill="#fff"/>
  <text x="600" y="38" fill="#222" font="600 24px Arial, sans-serif" text-anchor="middle">Coulomb-Net Research Pipeline</text>

  <rect class="box" x="35" y="90" width="245" height="150"/>
  <rect class="head" x="35" y="90" width="245" height="42"/>
  <text class="htext" x="157.5" y="117">Physical Simulation</text>
  <text class="text" x="157.5" y="165">Three point charges</text>
  <text class="text" x="157.5" y="190">Coulomb-law interactions</text>
  <text class="text" x="157.5" y="215">Synthetic observations</text>

  <path class="arrow" d="M280 165 H345"/>

  <rect class="box" x="355" y="90" width="245" height="150"/>
  <rect class="head" x="355" y="90" width="245" height="42"/>
  <text class="htext" x="477.5" y="117">Feature Construction</text>
  <text class="text" x="477.5" y="165">Particle positions</text>
  <text class="text" x="477.5" y="190">Electric-field components</text>
  <text class="text" x="477.5" y="215">Force components</text>

  <path class="arrow" d="M600 165 H665"/>

  <rect class="box" x="675" y="90" width="220" height="150"/>
  <rect class="head" x="675" y="90" width="220" height="42"/>
  <text class="htext" x="785" y="117">ML Regression</text>
  <text class="text" x="785" y="165">Configurable MLP</text>
  <text class="text" x="785" y="190">Two charge estimates</text>
  <text class="text" x="785" y="215">q₁ and q₂</text>

  <path class="arrow" d="M895 165 H960"/>

  <rect class="box" x="970" y="90" width="195" height="150"/>
  <rect class="head" x="970" y="90" width="195" height="42"/>
  <text class="htext" x="1067.5" y="117">Evaluation</text>
  <text class="text" x="1067.5" y="165">MSE</text>
  <text class="text" x="1067.5" y="190">R²</text>
  <text class="text" x="1067.5" y="215">Diagnostic plots</text>

  <text class="note" x="600" y="305">Conceptual overview; detailed implementation and experimental records are not included in this release.</text>
</svg>
